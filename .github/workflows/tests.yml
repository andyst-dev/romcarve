name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q romcarve.py tools docs tests
      - name: Synthetic tests and published-fact consistency
        run: python -m unittest discover -s tests -v
      - name: Pilot smoke tests without cartridges
        run: |
          python romcarve.py languages
          python romcarve.py plan
          python romcarve.py report --help
